name: Build hardware index

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_site.py'
      - 'ga_id.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: hardware-index-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate static site from live PCBWay library
        run: python build_site.py
      - name: Commit if changed
        run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add -A index.html sitemap.xml robots.txt feed.xml *.txt b c
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "index: rebuild $(date -u +%F)"
          git push
      - name: Ping search engines
        run: |
          curl -sS -o /dev/null -w "google %{http_code}\n" "https://www.google.com/ping?sitemap=https://hardware.securesupplies.us/sitemap.xml" || true
          curl -sS -o /dev/null -w "bing %{http_code}\n"   "https://www.bing.com/ping?sitemap=https://hardware.securesupplies.us/sitemap.xml" || true
